<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bötaye — Membre</title>
<meta name="theme-color" content="#1B4332" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="membre-icon-192.png" />
<link rel="icon" href="membre-icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .hidden { display: none !important; }
  .lien-bouton {
    background: none; border: none; padding: 8px;
    font-family: inherit; font-size: 14px; color: #1B4332;
    text-decoration: underline; cursor: pointer;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; display: block; margin: 0 auto; text-align: center;
  }
</style>
</head>
<body>

<div id="app">

  <section id="screen-loading" class="screen screen-center">
    <div class="wheel-loader" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42"/></svg>
    </div>
    <p class="loading-label">BÖTAYE</p>
  </section>

  <section id="screen-login" class="screen screen-center hidden">
    <div class="card card-form">
      <p class="eyebrow">BÖTAYE</p>
      <h1>Espace Membre</h1>
      <p class="subtitle">Connectez-vous pour suivre votre association.</p>
      <form id="form-login">
        <label>Téléphone
          <input type="tel" name="telephone" required />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required />
        </label>
        <button type="submit" class="btn btn-primary">Se connecter</button>
      </form>
      <button type="button" id="lien-vers-inscription" class="lien-bouton">Je n'ai pas encore de compte, m'inscrire avec un code</button>
    </div>
  </section>

  <section id="screen-inscription" class="screen screen-center hidden">
    <div class="card card-form">
      <p class="eyebrow">Nouveau membre</p>
      <h1>Créer mon compte</h1>
      <p class="subtitle">Saisissez le code reçu de votre bureau, puis vos informations.</p>
      <form id="form-inscription">
        <label>Code de l'association
          <input type="text" name="code" required placeholder="Ex : MBR-XXXXXX" style="text-transform:uppercase;" />
        </label>
        <label>Nom complet
          <input type="text" name="nom" required />
        </label>
        <label>Téléphone
          <input type="tel" name="telephone" required />
        </label>
        <label>Résidence actuelle
          <input type="text" name="residence" required placeholder="Ville où vous résidez" />
        </label>
        <label>Mot de passe
          <input type="password" name="password" required minlength="6" />
        </label>
        <p id="inscError" style="color:#c0392b; font-size:13px;"></p>
        <button type="submit" class="btn btn-primary">Créer mon compte</button>
      </form>
      <button type="button" id="lien-retour-login" class="lien-bouton">J'ai déjà un compte, me connecter</button>
    </div>
  </section>

  <section id="screen-dashboard" class="screen hidden">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="db-association-nom">—</p>
        <h1 id="db-membre-nom">—</h1>
      </div>
      <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button id="btn-changer-mdp" class="btn btn-ghost-sm">Changer mon mot de passe</button>
        <button id="btn-logout" class="btn btn-ghost">Déconnexion</button>
      </div>
    </header>

    <div class="cards-grid">
      <div class="stat-card">
        <p class="stat-label">Total cotisé</p>
        <p class="stat-value" id="stat-total-cotise">—</p>
      </div>
      <div class="stat-card">
        <p class="stat-label">Nombre de paiements</p>
        <p class="stat-value" id="stat-nb-cotisations">—</p>
      </div>
    </div>

    <div class="card">
      <h2>Mes cotisations</h2>
      <div id="liste-cotisations" class="entity-list"></div>
    </div>

  </section>

</div>

<div id="modal-overlay" class="modal-overlay hidden">
  <div id="modal-content" class="modal-content"></div>
</div>

<script>
  window.addEventListener('load', function () {
    setTimeout(async function () {
      var loading = document.getElementById('screen-loading');
      if (loading && !loading.classList.contains('hidden')) {
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            for (var i = 0; i < regs.length; i++) { await regs[i].unregister(); }
          }
          if ('caches' in window) {
            var noms = await caches.keys();
            for (var j = 0; j < noms.length; j++) { await caches.delete(noms[j]); }
          }
        } catch (e) { /* ignore */ }
        var diag = document.createElement('div');
        diag.style.cssText = "position:fixed;bottom:12px;left:12px;right:12px;background:#a94442;color:white;padding:10px 14px;border-radius:8px;font-size:12px;font-family:sans-serif;z-index:9999;text-align:center;";
        diag.textContent = "Le chargement a échoué. Cache technique vidé — appuyez ici pour recharger.";
        diag.addEventListener('click', function () { location.reload(true); });
        document.body.appendChild(diag);
      }
    }, 6000);
  });
</script>
<script type="module" src="js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
